<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Attendance Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <strong>Attendance Tracker</strong>
  <nav>
    <a href="{{ url_for('dashboard') }}">Today</a>
    <a href="{{ url_for('mark') }}">Mark attendance</a>
    <a href="{{ url_for('students') }}">Students</a>
    <a href="{{ url_for('report') }}">Report</a>
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}" role="status">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
